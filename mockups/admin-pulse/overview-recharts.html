<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelRadar · Overview (Recharts)</title>
<script>
(function(){var t="light";try{t=localStorage.getItem("pulse.theme")||"light"}catch(e){}
document.documentElement.setAttribute("data-theme",/^(light|dark)$/.test(t)?t:"light");})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/pulse-admin.css">

<!-- React + Recharts (UMD) + Babel — local demo only. No crossorigin (file://
     origin is null). Recharts UMD is umd/Recharts.js (NOT .min.js). -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.15.4/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
<div id="root" class="page"></div>

<script src="assets/overview-data.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const {
  ResponsiveContainer, LineChart, Line, AreaChart, Area, PieChart, Pie, Cell,
  FunnelChart, Funnel, LabelList, CartesianGrid, XAxis, YAxis, Tooltip
} = Recharts;

const D = window.OverviewData;
const META = D.SERIES_META;
const fmt = (n) => Math.round(n).toLocaleString("en-US");

function palette() {
  const s = getComputedStyle(document.documentElement);
  const v = (k) => s.getPropertyValue(k).trim();
  return { grid: v("--grid"), axis: v("--axis"), tick: v("--ink-faint"), ink: v("--ink"), surface: v("--surface"), indigo: v("--indigo") };
}
function PulseTip({ active, payload, label, unit }) {
  if (!active || !payload || !payload.length) return null;
  const rows = payload.slice().sort((a, b) => b.value - a.value);
  return (
    <div className="chart-tip show" style={{ position: "static", transform: "none", opacity: 1 }}>
      {label != null && <div className="t-name">Session {label}</div>}
      {rows.map((r, i) => (
        <div className="t-row" key={i}><i style={{ background: r.color || r.fill || r.stroke }} />{r.name}: <b>{unit === "$" ? "$" + r.value.toFixed(2) : fmt(r.value)}</b></div>
      ))}
    </div>
  );
}
const axisProps = (p) => ({ tick: { fill: p.tick, fontSize: 11, fontFamily: "Inter" }, tickLine: false, axisLine: false });

function Kpi({ k }) {
  const s = k.spark || [];
  const val = (k.prefix || "") + (k.dec ? k.value.toFixed(k.dec) : fmt(k.value)) + (k.suffix || "");
  let spark = null;
  if (s.length) {
    const min = Math.min(...s), max = Math.max(...s), span = (max - min) || 1;
    const coords = s.map((v, i) => [(i / (s.length - 1)) * 200, 4 + (1 - (v - min) / span) * 32]);
    const d = coords.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
    const color = k.up ? "var(--green)" : "var(--red)";
    spark = (
      <svg className="kpi-spark" viewBox="0 0 200 40" preserveAspectRatio="none">
        <path d={d} fill="none" stroke={color} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
        <circle cx={coords[coords.length - 1][0]} cy={coords[coords.length - 1][1]} r="3" fill="var(--surface)" stroke={color} strokeWidth="2" />
      </svg>
    );
  }
  return (
    <section className="tile t-kpi">
      <div className="kpi-head"><span className="tile-label" style={{ display: "block" }}>{k.label}</span>
        <span className={"chip " + (k.up ? "up" : "down")}>{k.delta}</span></div>
      <div className="big-num kpi-val">{val}</div>
      <div className="kpi-meta">{k.meta || ""}</div>
      {spark}
    </section>
  );
}

function LineTile({ p }) {
  const [hidden, setHidden] = useState({});
  const data = useMemo(() => D.TICKS.map((t, i) => ({ name: t, "Reels seen": D.REELS[i], Relevant: D.RELEVANT[i], Matches: D.MATCHES[i] })), []);
  const visible = META.filter((_, i) => !hidden[i]).length;
  const toggle = (i) => setHidden((h) => (!h[i] && visible <= 1) ? h : ({ ...h, [i]: !h[i] }));
  return (
    <section className="tile t-lines">
      <div className="tile-label"><span>Engine activity by session</span><span className="lbl-note">reels · relevant · matches</span></div>
      <div className="legend" role="group">
        {META.map((c, i) => (
          <button key={i} type="button" onClick={() => toggle(i)} style={{ border: "none", background: "none", cursor: "pointer", font: "inherit", color: "inherit", display: "inline-flex", alignItems: "center", opacity: hidden[i] ? 0.4 : 1 }}>
            <i style={{ background: c.color }} />{c.name}
          </button>
        ))}
      </div>
      <div className="chart-wrap">
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={data} margin={{ top: 10, right: 12, bottom: 4, left: -10 }}>
            <CartesianGrid stroke={p.grid} vertical={false} />
            <XAxis dataKey="name" {...axisProps(p)} />
            <YAxis {...axisProps(p)} width={40} />
            <Tooltip content={<PulseTip />} cursor={{ stroke: p.axis, strokeDasharray: "4 4" }} />
            {META.map((c, i) => !hidden[i] && (
              <Line key={i} type="monotone" dataKey={c.name} stroke={c.color} strokeWidth={2.6}
                dot={{ r: 2.6, fill: p.surface, stroke: c.color, strokeWidth: 2 }} activeDot={{ r: 4 }} animationDuration={900} />
            ))}
          </LineChart>
        </ResponsiveContainer>
      </div>
    </section>
  );
}

function FunnelTile({ p }) {
  const maxV = D.FUNNEL[0].value;
  const data = D.FUNNEL.map((s) => ({ name: s.name, value: s.value, fill: s.color }));
  return (
    <section className="tile t-funnel">
      <div className="tile-label"><span>Discovery funnel</span><span className="lbl-note">reels → matches</span></div>
      <div className="funnel-flex">
        <div className="funnel-box" style={{ minHeight: 220 }}>
          <ResponsiveContainer width="100%" height="100%">
            <FunnelChart>
              <Tooltip content={<PulseTip />} />
              <Funnel dataKey="value" data={data} isAnimationActive animationDuration={800} stroke="none">
                <LabelList position="center" fill="#fff" stroke="none" dataKey="value" style={{ fontFamily: "Sora", fontWeight: 800, fontSize: 16 }} />
              </Funnel>
            </FunnelChart>
          </ResponsiveContainer>
        </div>
        <div className="funnel-legend">
          {D.FUNNEL.map((s, i) => (
            <div className="fn-row" key={i}>
              <i style={{ background: s.color }} /><span className="fn-rn">{s.name}</span>
              <span className="fn-rv">{fmt(s.value)}<br /><span className="fn-rp">{Math.round(s.value / maxV * 100)}%</span></span>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function DonutTile() {
  const total = D.ROUTING.reduce((t, r) => t + r.value, 0);
  return (
    <section className="tile t-donut">
      <div className="tile-label"><span>Call routing</span><span className="lbl-note">this period</span></div>
      <div className="donut-flex">
        <div className="donut-box" style={{ height: 200 }}>
          <ResponsiveContainer width="100%" height="100%">
            <PieChart>
              <Pie data={D.ROUTING} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={62} outerRadius={90} paddingAngle={2} stroke="none" startAngle={90} endAngle={-270} animationDuration={900}>
                {D.ROUTING.map((d, i) => <Cell key={i} fill={d.color} />)}
              </Pie>
              <Tooltip content={<PulseTip />} />
            </PieChart>
          </ResponsiveContainer>
          <div className="donut-center"><span className="big-num">{fmt(total)}</span><small>total calls</small></div>
        </div>
        <div className="donut-legend">
          {D.ROUTING.map((d, i) => (
            <div className="dl-row" key={i}>
              <i style={{ background: d.color }} /><span className="dl-name">{d.name}</span>
              <span className="dl-amt">{fmt(d.value)}</span><span className="dl-share">{Math.round(d.value / total * 100)}%</span>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function AreaTile({ p }) {
  const data = useMemo(() => D.TICKS.map((t, i) => ({ name: t, Spend: D.SPEND_CUM[i] })), []);
  return (
    <section className="tile t-area">
      <div className="tile-label"><span>Cloud spend (cumulative)</span><span className="chip up">−6%</span></div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginTop: 14 }}>
        <span className="big-num" style={{ fontSize: 34 }}><span style={{ fontSize: 18, color: "var(--ink-faint)", verticalAlign: 10 }}>$</span>1.40</span>
        <span className="lbl-note">spent of $5.00 cap · forward-only</span>
      </div>
      <div className="chart-wrap">
        <ResponsiveContainer width="100%" height="100%">
          <AreaChart data={data} margin={{ top: 10, right: 12, bottom: 4, left: -8 }}>
            <defs><linearGradient id="rcArea2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={p.indigo} stopOpacity={0.28} /><stop offset="100%" stopColor={p.indigo} stopOpacity={0} />
            </linearGradient></defs>
            <CartesianGrid stroke={p.grid} vertical={false} />
            <XAxis dataKey="name" {...axisProps(p)} />
            <YAxis {...axisProps(p)} width={44} tickFormatter={(v) => "$" + v.toFixed(1)} />
            <Tooltip content={<PulseTip unit="$" />} cursor={{ stroke: p.axis, strokeDasharray: "4 4" }} />
            <Area type="monotone" dataKey="Spend" stroke={p.indigo} strokeWidth={2.6} fill="url(#rcArea2)" dot={false} activeDot={{ r: 4.5, fill: p.indigo, stroke: p.surface, strokeWidth: 2 }} animationDuration={1000} />
          </AreaChart>
        </ResponsiveContainer>
      </div>
    </section>
  );
}

function App() {
  const [theme, setTheme] = useState(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
  const p = useMemo(() => palette(), [theme]);
  const toggle = () => {
    const next = theme === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("pulse.theme", next); } catch (e) {}
    setTheme(next);
  };
  return (
    <React.Fragment>
      <div className="labbar">
        <div className="lab-brand"><span className="dot" />ReelRadar · Pulse</div>
        <div className="lab-spacer" />
        <nav className="variant" aria-label="Chart approach">
          <a href="overview-svg.html">Custom SVG</a>
          <a href="overview-recharts.html" className="active">Recharts</a>
        </nav>
        <button className="theme-toggle" type="button" aria-label="Toggle theme" onClick={toggle}>
          {theme === "dark"
            ? <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
            : <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>}
        </button>
      </div>

      <header className="greeting">
        <div>
          <h1>Overview</h1>
          <p className="sub">One glance: is it working, is it safe, is it cheap — <strong>last 12 sessions</strong>.</p>
        </div>
        <span className="badge-approach">Recharts</span>
      </header>

      <main className="bento">
        {D.KPIS.map((k, i) => <Kpi key={i} k={k} />)}
        <LineTile p={p} />
        <FunnelTile p={p} />
        <DonutTile />
        <AreaTile p={p} />
      </main>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
