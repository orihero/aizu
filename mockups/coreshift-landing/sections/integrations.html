<section class="section section--integrations surface" id="integrations">
  <div class="container integrations-container">
    <div class="integrations-panel">

      <div class="integrations-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="27" height="27" fill="none">
          <defs>
            <rect id="integrations-tooth-lg" x="7.6" y="1.6" width="2.0" height="2.8" rx="0.55"></rect>
            <rect id="integrations-tooth-sm" x="15.45" y="11.2" width="1.5" height="2.1" rx="0.45"></rect>
          </defs>
          <g fill="var(--coral)">
            <use href="#integrations-tooth-lg" transform="rotate(0 8.6 8.6)"></use>
            <use href="#integrations-tooth-lg" transform="rotate(45 8.6 8.6)"></use>
            <use href="#integrations-tooth-lg" transform="rotate(90 8.6 8.6)"></use>
            <use href="#integrations-tooth-lg" transform="rotate(135 8.6 8.6)"></use>
            <use href="#integrations-tooth-lg" transform="rotate(180 8.6 8.6)"></use>
            <use href="#integrations-tooth-lg" transform="rotate(225 8.6 8.6)"></use>
            <use href="#integrations-tooth-lg" transform="rotate(270 8.6 8.6)"></use>
            <use href="#integrations-tooth-lg" transform="rotate(315 8.6 8.6)"></use>
          </g>
          <circle cx="8.6" cy="8.6" r="5.0" fill="var(--coral)"></circle>
          <circle cx="8.6" cy="8.6" r="2.0" fill="#fff"></circle>

          <g fill="var(--coral)">
            <use href="#integrations-tooth-sm" transform="rotate(0 16.2 16.2)"></use>
            <use href="#integrations-tooth-sm" transform="rotate(60 16.2 16.2)"></use>
            <use href="#integrations-tooth-sm" transform="rotate(120 16.2 16.2)"></use>
            <use href="#integrations-tooth-sm" transform="rotate(180 16.2 16.2)"></use>
            <use href="#integrations-tooth-sm" transform="rotate(240 16.2 16.2)"></use>
            <use href="#integrations-tooth-sm" transform="rotate(300 16.2 16.2)"></use>
          </g>
          <circle cx="16.2" cy="16.2" r="3.4" fill="var(--coral)"></circle>
          <circle cx="16.2" cy="16.2" r="1.3" fill="#fff"></circle>
        </svg>
      </div>

      <h2 class="h2 integrations-title">Integrate with your existing<br>tools in seconds</h2>

      <div class="integrations-arc">
        <div class="integrations-arc__stage">

          <div class="integrations-tile" data-name="Microsoft Teams" data-desc="Team chat &amp; collaboration">
            <img class="integrations-tile__logo" src="assets/logos/teams.svg" alt="Microsoft Teams">
          </div>
          <div class="integrations-tile" data-name="Gmail" data-desc="Email in one inbox">
            <img class="integrations-tile__logo" src="assets/logos/gmail.svg" alt="Gmail">
          </div>
          <div class="integrations-tile" data-name="Loom" data-desc="Video feedback &amp; communication">
            <img class="integrations-tile__logo" src="assets/logos/loom.svg" alt="Loom">
          </div>
          <div class="integrations-tile" data-name="Google Meet" data-desc="Seamless video meetings">
            <img class="integrations-tile__logo" src="assets/logos/google-meet.svg" alt="Google Meet">
          </div>
          <div class="integrations-tile" data-name="Microsoft Outlook" data-desc="Email &amp; schedule management">
            <img class="integrations-tile__logo" src="assets/logos/outlook.svg" alt="Microsoft Outlook">
          </div>

        </div>

        <div class="integrations-caption">
          <p class="integrations-caption__name">Loom</p>
          <p class="integrations-caption__desc">Video feedback &amp; communication</p>
        </div>
      </div>

    </div>
  </div>
</section>
