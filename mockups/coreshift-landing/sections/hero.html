<section class="section section--hero" id="hero">
  <div class="container hero-inner">

    <div class="hero-graph" aria-hidden="true">
      <svg class="hero-connectors" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid meet">
        <path class="hero-line" data-line="trunk-left" d="M632 200 L254 200"></path>
        <path class="hero-line" data-line="trunk-right" d="M808 200 L1190 200"></path>
        <path class="hero-line hero-line--diag" data-line="diag-left-up" d="M511 200 L432 96 L367 93"></path>
        <path class="hero-line hero-line--diag" data-line="diag-left-down" d="M557 200 L486 283 L420 283"></path>
        <path class="hero-line hero-line--diag" data-line="diag-right-up" d="M881 200 L956 112 L1016 112"></path>
        <path class="hero-line hero-line--diag" data-line="diag-right-down" d="M923 200 L1003 307 L1069 307"></path>
        <circle class="hero-dot" data-dot="left-up" cx="432" cy="96" r="3"></circle>
        <circle class="hero-dot" data-dot="left-down" cx="486" cy="283" r="3"></circle>
        <circle class="hero-dot" data-dot="right-up" cx="956" cy="112" r="3"></circle>
        <circle class="hero-dot" data-dot="right-down" cx="1003" cy="307" r="3"></circle>
      </svg>

      <!-- Centre node -->
      <div class="hero-tile-pos" data-tile="center" style="--x:720;--y:200;--size:176">
        <div class="hero-tile-parallax" data-depth="0.3">
          <div class="hero-tile hero-tile--center">
            <div class="hero-roulette">
              <span class="hero-roulette-icon" data-icon="scan">
                <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3"></path><path d="M16 4h3a1 1 0 0 1 1 1v3"></path><path d="M20 16v3a1 1 0 0 1-1 1h-3"></path><path d="M8 20H5a1 1 0 0 1-1-1v-3"></path></svg>
              </span>
              <span class="hero-roulette-icon" data-icon="sparkle-x">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </span>
              <span class="hero-roulette-icon" data-icon="slash">
                <svg viewBox="0 0 24 24"><path d="M7 17L17 7"></path></svg>
              </span>
              <span class="hero-roulette-icon" data-icon="plus">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
              </span>
              <span class="hero-roulette-icon" data-icon="backslash">
                <svg viewBox="0 0 24 24"><path d="M7 7l10 10"></path></svg>
              </span>
              <span class="hero-roulette-icon" data-icon="star">
                <svg viewBox="0 0 24 24"><path d="M12 3.5c.7 3.2 2 5.7 4.9 6.5-2.9.8-4.2 3.3-4.9 6.5-.7-3.2-2-5.7-4.9-6.5 2.9-.8 4.2-3.3 4.9-6.5z"></path></svg>
              </span>
              <span class="hero-roulette-icon" data-icon="orbit">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><ellipse cx="12" cy="12" rx="9.5" ry="3.6" transform="rotate(-22 12 12)"></ellipse></svg>
              </span>
              <span class="hero-roulette-icon" data-icon="check">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.4l2.6 2.6L16 9.4"></path></svg>
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Left signal chip: AIZU ping mark (dot + arc), same as nav/favicon -->
      <div class="hero-tile-pos" data-tile="portrait-left" style="--x:179;--y:200;--size:150">
        <div class="hero-tile-parallax" data-depth="1">
          <div class="hero-tile hero-tile--signal">
            <svg class="hero-tile__mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#aizu-mark"/></svg>
            <span class="hero-tile__label">Ask</span>
          </div>
        </div>
      </div>

      <!-- Yellow lightbulb -->
      <div class="hero-tile-pos" data-tile="yellow" style="--x:324;--y:85;--size:86">
        <div class="hero-tile-parallax" data-depth="0.78">
          <div class="hero-tile hero-tile--yellow">
            <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11.2c.6.4 1 1.1 1 1.8h4c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"></path></svg>
          </div>
        </div>
      </div>

      <!-- Cyan balloons -->
      <div class="hero-tile-pos" data-tile="cyan" style="--x:365;--y:284;--size:110">
        <div class="hero-tile-parallax" data-depth="0.7">
          <div class="hero-tile hero-tile--cyan">
            <svg viewBox="0 0 24 24">
              <ellipse cx="9" cy="8.2" rx="3.3" ry="4.1"></ellipse>
              <path d="M9 12.3l-.5 2M9 12.3l.7 1.6-1 1.4 1 1"></path>
              <ellipse cx="15.6" cy="11" rx="2.6" ry="3.2"></ellipse>
              <path d="M15.6 14.2l.4 1.7M15.6 14.2l-.5 1.2.9 1-.6 1"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Red shield -->
      <div class="hero-tile-pos" data-tile="red" style="--x:1075;--y:95;--size:118">
        <div class="hero-tile-parallax" data-depth="0.7">
          <div class="hero-tile hero-tile--red">
            <svg viewBox="0 0 24 24">
              <path class="hero-shield-outline" d="M12 3.2l6.5 2.6v4.6c0 4.6-3.1 7.6-6.5 8.6-3.4-1-6.5-4-6.5-8.6V5.8L12 3.2z"></path>
              <path class="hero-bolt" d="M13.1 7.6l-3.4 5h2.4l-.9 3.8 3.9-5.4h-2.4l2.4-3.4z"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Lower right signal chip: AIZU ping mark (dot + arc), same as nav/favicon -->
      <div class="hero-tile-pos" data-tile="portrait-right" style="--x:1117;--y:312;--size:96">
        <div class="hero-tile-parallax" data-depth="0.78">
          <div class="hero-tile hero-tile--signal">
            <svg class="hero-tile__mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#aizu-mark"/></svg>
            <span class="hero-tile__label">Match</span>
          </div>
        </div>
      </div>

      <!-- Far right eyes tile -->
      <div class="hero-tile-pos" data-tile="eyes" style="--x:1260;--y:200;--size:140">
        <div class="hero-tile-parallax" data-depth="1">
          <div class="hero-tile hero-tile--eyes">
            <svg viewBox="0 0 48 24">
              <ellipse cx="13" cy="12" rx="8.2" ry="9.6"></ellipse>
              <circle class="hero-pupil" cx="15.6" cy="12.4" r="4.3"></circle>
              <ellipse cx="35" cy="12" rx="8.2" ry="9.6"></ellipse>
              <circle class="hero-pupil" cx="37.6" cy="12.4" r="4.3"></circle>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="hero-copy">
      <h1 class="h1 hero-heading">Meet customers<br>while they decide</h1>
      <p class="lead hero-lead">Tell AIZU what you sell and who you serve. It returns a short list of ready-to-buy customers, every week.</p>
      <a href="#" class="btn btn--coral hero-cta">Start free</a>
    </div>

  </div>
</section>
