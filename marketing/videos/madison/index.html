<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AIZU — Scene 05 · Three Pillars + Price</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Sora";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/sora-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Ink × Lime — DARK palette, continuing straight out of scene 04. */
      :root {
        --bg: #0e0f14;
        --surface: #181a22;
        --surface-2: #20232d;
        --border: #282c38;
        --text: #f1f2f6;
        --muted: #a2a7b6;
        --lime: #d9f24f;
        --on-lime: #16161a;
        --r-tile: 23px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      #bg-glow {
        position: absolute;
        left: 260px;
        top: 120px;
        width: 1400px;
        height: 1000px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 242, 79, 0.13), rgba(217, 242, 79, 0) 70%);
        filter: blur(70px);
      }

      #scene {
        position: absolute;
        inset: 0;
        perspective: 1900px;
      }

      /* ---------- the real product ---------- */
      #dash-slot {
        position: absolute;
        left: 286px;
        top: 258px;
        width: 1348px;
        height: 758px;
      }
      #dash {
        width: 100%;
        height: 100%;
        border-radius: var(--r-tile);
        border: 1px solid var(--border);
        overflow: hidden;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), 0 8px 24px rgba(0, 0, 0, 0.4);
        opacity: 0;
      }
      #dash img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }
      /* keeps the price legible over the busy lower half of the dashboard */
      #scrim {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 460px;
        background: linear-gradient(to top, rgba(14, 15, 20, 0.94), rgba(14, 15, 20, 0));
        opacity: 0;
      }

      /* ---------- the three pillars ---------- */
      #pillars {
        position: absolute;
        left: 0;
        right: 0;
        top: 108px;
        display: flex;
        justify-content: center;
        gap: 30px;
      }
      .pillar {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 22px 34px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-tile);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        font-family: Sora, Inter, sans-serif;
        font-weight: 600;
        font-size: 32px;
        letter-spacing: -0.01em;
        white-space: nowrap;
        opacity: 0;
      }
      .pillar svg {
        display: block;
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
      }

      /* ---------- the price ---------- */
      #price {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 132px;
        display: flex;
        justify-content: center;
      }
      #price-pill {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 26px 60px;
        border-radius: 999px;
        background: var(--lime);
        color: var(--on-lime);
        box-shadow: 0 24px 60px rgba(217, 242, 79, 0.22);
        opacity: 0;
      }
      #price-amount {
        font-family: Sora, Inter, sans-serif;
        font-weight: 700;
        font-size: 96px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      #price-unit {
        font-family: Sora, Inter, sans-serif;
        font-weight: 600;
        font-size: 40px;
        letter-spacing: -0.01em;
      }
      #price-note {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 74px;
        text-align: center;
        font-size: 27px;
        letter-spacing: 0.02em;
        color: var(--muted);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="8.53"
    >
      <div id="bg" class="clip" data-start="0" data-duration="8.53" data-track-index="0">
        <div id="bg-glow"></div>
      </div>

      <div id="scene" class="clip" data-start="0" data-duration="8.53" data-track-index="1">
        <div id="dash-slot">
          <div id="dash"><img src="assets/capture/dashboard.png" alt="AIZU dashboard" /></div>
        </div>

        <div id="pillars">
          <div class="pillar">
            <svg viewBox="0 0 24 24" fill="none" stroke="#d9f24f" stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.6-3.6" stroke-linecap="round" />
            </svg>
            Find leads
          </div>
          <div class="pillar">
            <svg viewBox="0 0 24 24" fill="none" stroke="#d9f24f" stroke-width="2">
              <rect x="3" y="4" width="6" height="16" rx="1.5" />
              <rect x="11" y="4" width="6" height="10" rx="1.5" />
              <path d="M20 4v6" stroke-linecap="round" />
            </svg>
            Manage them
          </div>
          <div class="pillar">
            <svg viewBox="0 0 24 24" fill="none" stroke="#d9f24f" stroke-width="2">
              <path d="M4 19V5" stroke-linecap="round" />
              <path d="M4 19h16" stroke-linecap="round" />
              <path d="m7 15 4-5 3 3 5-7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Actionable insights
          </div>
        </div>

        <div id="scrim"></div>

        <div id="price">
          <div id="price-pill">
            <span id="price-amount">$29</span><span id="price-unit">/month</span>
          </div>
        </div>
        <div id="price-note">no contract · cancel any time</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const DASH_AT = 0.05;
      const PILLARS_AT = 0.85;
      const PILLAR_STEP = 1.1; /* paced to the spoken phrases, not one arrival beat */
      const PRICE_AT = 4.15;
      const SCENE_END = 8.53;

      /* 1 · the real product arrives */
      tl.fromTo(
        "#dash",
        { opacity: 0, scale: 0.95, y: 64 },
        { opacity: 1, scale: 1, y: 0, duration: 0.9, ease: "power3.out" },
        DASH_AT,
      );

      /* 2 · one pillar per spoken phrase */
      gsap.utils.toArray(".pillar").forEach((el, i) => {
        tl.fromTo(
          el,
          { opacity: 0, scale: 0.9, y: -24 },
          { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
          PILLARS_AT + i * PILLAR_STEP,
        );
      });

      /* 3 · the price gets its own beat — the reference only ever said it out loud */
      tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.out" }, PRICE_AT - 0.25);
      tl.fromTo(
        "#price-pill",
        { opacity: 0, scale: 0.86, y: 34 },
        { opacity: 1, scale: 1, y: 0, duration: 0.62, ease: "power3.out" },
        PRICE_AT,
      );
      tl.fromTo(
        "#price-note",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        PRICE_AT + 0.3,
      );

      /* 4 · slow settle across the hold */
      tl.fromTo(
        "#dash",
        { scale: 1 },
        { scale: 1.03, duration: SCENE_END - PRICE_AT, ease: "sine.inOut" },
        PRICE_AT,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
