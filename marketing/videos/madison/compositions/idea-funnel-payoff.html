<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AIZU — Scene 02 · Variant C — Money In, Noise Out</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Sora";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/sora-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Sora";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/sora-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      :root {
        --bg: #eef0f3;
        --surface: #ffffff;
        --surface-2: #f4f5f9;
        --border: #e6e8ee;
        --text: #16161a;
        --muted: #5b5e6b;
        --faint: #747680;
        --brand: #16161a;
        --brand-deep: #34343d;
        --accent: #d9f24f;
        --on-accent: #16161a;
        --on-brand: #ffffff;
        --danger: #dc2626;
        --r-tile: 23px;
        --r-card: 17px;
        --shadow-card: 0 24px 60px rgba(22, 22, 26, 0.1), 0 4px 12px rgba(22, 22, 26, 0.05);
        --shadow-chip: 0 12px 28px rgba(22, 22, 26, 0.1), 0 2px 6px rgba(22, 22, 26, 0.05);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      #bg-dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(22, 22, 26, 0.07) 1.5px, transparent 1.5px);
        background-size: 46px 46px;
      }
      #bg-glow {
        position: absolute;
        left: 310px;
        top: 40px;
        width: 1300px;
        height: 1040px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 242, 79, 0.4), rgba(217, 242, 79, 0) 70%);
        filter: blur(60px);
      }

      #scene {
        position: absolute;
        inset: 0;
      }

      /* Entrance elements start hidden in CSS — a zero-duration tl.set at t=0 is not
         reliably applied when the renderer seeks to exactly 0. Opacity only, so it
         never collides with a GSAP scale tween. */
      #bar,
      #sweep,
      .caption,
      .coin,
      .noise,
      .lead,
      #tag {
        opacity: 0;
      }
      .caption {
        position: absolute;
        font-family: Sora, Inter, sans-serif;
        font-weight: 600;
        font-size: 26px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--faint);
      }
      /* Kept off to the left so the falling budget never collides with it. */
      #cap-top {
        left: 120px;
        top: 96px;
      }

      /* ---------- falling budget ---------- */
      .coin {
        position: absolute;
        top: 360px;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--accent);
        color: var(--on-accent);
        font-family: Sora, Inter, sans-serif;
        font-weight: 700;
        font-size: 26px;
        box-shadow: 0 6px 16px rgba(22, 22, 26, 0.14);
      }

      /* ---------- the six platforms ---------- */
      #bar {
        position: absolute;
        left: 370px;
        top: 468px;
        width: 1180px;
        height: 138px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 34px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-tile);
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }
      #sweep {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform-origin: 0% 50%;
        background: linear-gradient(
          90deg,
          rgba(217, 242, 79, 0) 0%,
          rgba(217, 242, 79, 0.75) 50%,
          rgba(217, 242, 79, 0) 100%
        );
      }
      .plat {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        border-radius: var(--r-card);
        background: var(--surface-2);
        border: 1px solid var(--border);
      }
      .plat img {
        display: block;
        width: 44px;
        height: 44px;
        object-fit: contain;
      }

      /* ---------- what comes out ---------- */
      .noise {
        position: absolute;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #b9bcc6;
      }
      .lead {
        position: absolute;
        top: 700px;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: var(--brand);
        box-shadow: 0 10px 26px rgba(22, 22, 26, 0.28);
      }
      #lead-1 {
        left: 890px;
      }
      #lead-2 {
        left: 972px;
      }
      #tag {
        position: absolute;
        left: 700px;
        top: 812px;
        width: 520px;
        padding: 18px 0;
        text-align: center;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-family: Sora, Inter, sans-serif;
        font-weight: 700;
        font-size: 33px;
      }
      #cap-waste {
        left: 120px;
        top: 964px;
        font-size: 23px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5.5"
    >
      <div id="bg" class="clip" data-start="0" data-duration="5.5" data-track-index="0">
        <div id="bg-dots"></div>
        <div id="bg-glow"></div>
      </div>

      <div id="scene" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
        <div id="cap-top" class="caption">Ad budget in</div>

        <div id="coins"></div>

        <div id="bar">
          <span id="sweep"></span>
          <div class="plat"><img src=".media/images/logo_002.svg" alt="Instagram" /></div>
          <div class="plat"><img src=".media/images/logo_001.svg" alt="Telegram" /></div>
          <div class="plat"><img src=".media/images/logo_006.svg" alt="YouTube" /></div>
          <div class="plat"><img src=".media/images/logo_004.svg" alt="LinkedIn" /></div>
          <div class="plat"><img src=".media/images/logo_008.svg" alt="Reddit" /></div>
          <div class="plat"><img src=".media/images/logo_010.svg" alt="X" /></div>
        </div>

        <div id="noise"></div>

        <div id="lead-1" class="lead"></div>
        <div id="lead-2" class="lead"></div>
        <div id="tag">2 actually worth calling</div>
        <div id="cap-waste" class="caption">everything else · noise</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Index-derived offsets stand in for randomness — deterministic under seek. */
      const COIN_N = 16;
      const NOISE_N = 16;
      const jitter = (i, m) => ((i * 41) % m) - Math.floor(m / 2);

      const coinHost = document.getElementById("coins");
      for (let i = 0; i < COIN_N; i++) {
        const c = document.createElement("div");
        c.className = "coin";
        c.id = "coin-" + i;
        c.style.left = 486 + i * 62 + "px";
        c.textContent = "$";
        coinHost.appendChild(c);
      }

      const noiseHost = document.getElementById("noise");
      for (let i = 0; i < NOISE_N; i++) {
        const d = document.createElement("div");
        d.className = "noise";
        d.id = "noise-" + i;
        const side = i % 2 ? 1 : -1;
        const offset = 190 + Math.floor(i / 2) * 80;
        d.style.left = 960 + side * offset - 11 + "px";
        d.style.top = 838 + ((i * 37) % 7) * 22 + "px";
        noiseHost.appendChild(d);
      }

      const FALL_AT = 0.35;
      const SWEEP_AT = 2.25;
      const OUT_AT = 2.8;
      const LEADS_AT = 3.5;
      const SCENE_END = 5.5;

      /* 1 · the bar of platforms is already the thing money runs into */
      tl.fromTo(
        "#bar",
        { scale: 0.94, opacity: 0, y: 26 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.1,
      );
      tl.fromTo("#cap-top", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5 }, 0.25);

      /* Claim collapsed states at t=0 — frame 0 must not be a stale formed frame. */
      tl.set("#bar", { scale: 0.94, opacity: 0, y: 26 }, 0);
      tl.set(["#cap-top", "#cap-waste"], { opacity: 0 }, 0);
      tl.set(".coin", { opacity: 0 }, 0);
      tl.set(".noise", { opacity: 0, scale: 0.5 }, 0);
      tl.set(".lead", { opacity: 0 }, 0);
      tl.set("#tag", { scale: 0.86, opacity: 0 }, 0);
      tl.set("#sweep", { scaleX: 0 }, 0);

      /* 2 · budget rains down and is absorbed. Arrival order is decorrelated from x
         (i*7 mod N) so it reads as rain, not a diagonal wipe. */
      for (let i = 0; i < COIN_N; i++) {
        const at = FALL_AT + ((i * 7) % COIN_N) * 0.105;
        const drop = 560 + jitter(i, 180);
        tl.fromTo(
          "#coin-" + i,
          { y: -drop, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.95, ease: "power1.in" },
          at,
        );
        tl.to("#coin-" + i, { opacity: 0, duration: 0.2, ease: "none" }, at + 0.95);
      }

      /* 3 · the platforms chew through it */
      tl.fromTo(
        "#sweep",
        { scaleX: 0, opacity: 0.9 },
        { scaleX: 1, duration: 0.85, ease: "power2.inOut" },
        SWEEP_AT,
      );
      tl.to("#sweep", { opacity: 0, duration: 0.35, ease: "none" }, SWEEP_AT + 0.7);

      /* 4 · and almost all of it falls out the bottom as noise */
      for (let i = 0; i < NOISE_N; i++) {
        tl.fromTo(
          "#noise-" + i,
          { y: -120, opacity: 0, scale: 0.5 },
          { y: 0, opacity: 0.85, scale: 1, duration: 0.7, ease: "power2.out" },
          OUT_AT + (i % 8) * 0.055,
        );
        tl.to(
          "#noise-" + i,
          { y: 48 + jitter(i, 40), opacity: 0.28, duration: 1.6, ease: "sine.out" },
          OUT_AT + 0.7 + (i % 8) * 0.055,
        );
      }

      /* 5 · two survive */
      tl.fromTo(
        "#lead-1",
        { y: -190, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        LEADS_AT,
      );
      tl.fromTo(
        "#lead-2",
        { y: -190, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        LEADS_AT + 0.12,
      );
      tl.fromTo(
        "#tag",
        { scale: 0.86, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        LEADS_AT + 0.45,
      );
      tl.fromTo("#cap-waste", { opacity: 0 }, { opacity: 1, duration: 0.5 }, OUT_AT + 0.9);

      tl.set("#bg-glow", { opacity: 0.35 }, 0);
      tl.to("#bg-glow", { opacity: 0.9, duration: 2.4, ease: "sine.inOut" }, FALL_AT);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
