<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AIZU — Scene 09 · It Learns Your ICP</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Sora";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/sora-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --bg: #0e0f14;
        --surface: #181a22;
        --surface-2: #20232d;
        --border: #282c38;
        --text: #f1f2f6;
        --muted: #a2a7b6;
        --faint: #8f96a8;
        --lime: #d9f24f;
        --on-lime: #16161a;
        /* the panel's real dark score colours: weak = warn, strong = success */
        --warn: #fbbf24;
        --success: #34d399;
        --r-tile: 23px;
        --r-card: 17px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      #bg-glow {
        position: absolute;
        left: 700px;
        top: 200px;
        width: 1100px;
        height: 860px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(52, 211, 153, 0.15), rgba(52, 211, 153, 0) 70%);
        filter: blur(80px);
        opacity: 0;
      }

      #scene {
        position: absolute;
        inset: 0;
      }

      #cap-top {
        position: absolute;
        left: 0;
        right: 0;
        top: 128px;
        text-align: center;
        font-family: Sora, Inter, sans-serif;
        font-weight: 600;
        font-size: 26px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0;
      }

      /* ---------- the rising trend behind the tiles ---------- */
      #trend {
        position: absolute;
        left: 258px;
        top: 300px;
        width: 1404px;
        height: 470px;
        overflow: visible;
      }
      #trend-line {
        fill: none;
        stroke: var(--lime);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0.55;
      }

      /* Empty slots hold the composition from frame 0 — without them the frame is
         two-thirds empty while the first tile sits alone on the left. The tiles are
         opaque and land exactly on top of them. */
      .slot {
        position: absolute;
        top: 330px;
        width: 420px;
        height: 404px;
        border: 1px dashed #232733;
        border-radius: var(--r-tile);
      }
      #slot-1 {
        left: 258px;
      }
      #slot-2 {
        left: 750px;
      }
      #slot-3 {
        left: 1242px;
      }

      /* ---------- three periods ---------- */
      #cols {
        position: absolute;
        left: 0;
        right: 0;
        top: 330px;
        display: flex;
        justify-content: center;
        gap: 72px;
      }
      .col {
        width: 420px;
        padding: 34px 34px 30px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-tile);
        box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
        opacity: 0;
      }
      .col-head {
        font-family: Sora, Inter, sans-serif;
        font-weight: 600;
        font-size: 23px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .col-score {
        margin-top: 14px;
        font-family: Sora, Inter, sans-serif;
        font-weight: 700;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      .col-sub {
        margin-top: 10px;
        font-size: 22px;
        color: var(--faint);
      }
      .track {
        margin-top: 24px;
        height: 12px;
        border-radius: 999px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .fill {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 999px;
        transform-origin: 0% 50%;
        opacity: 0;
      }
      .rows {
        margin-top: 26px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 18px;
        border-radius: var(--r-card);
        background: var(--surface-2);
        border: 1px solid var(--border);
      }
      .row-handle {
        font-size: 22px;
        color: var(--muted);
      }
      .pill {
        padding: 3px 13px;
        border-radius: 999px;
        font-family: Sora, Inter, sans-serif;
        font-weight: 700;
        font-size: 19px;
        color: var(--on-lime);
      }
      /* Pills always keep ink text on a coloured fill — the variant class drives the
         FILL only. (Setting both to the same token gives 1:1 contrast.) */
      .weak .col-score {
        color: var(--warn);
      }
      .weak .pill {
        background: var(--warn);
      }
      .mid .col-score {
        color: var(--lime);
      }
      .mid .pill {
        background: var(--lime);
      }
      .strong .col-score {
        color: var(--success);
      }
      .strong .pill {
        background: var(--success);
      }
      .weak .fill {
        background: var(--warn);
      }
      .mid .fill {
        background: var(--lime);
      }
      .strong .fill {
        background: var(--success);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="bg-glow"></div>
      </div>

      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="cap-top">average match score</div>

        <svg id="trend" viewBox="0 0 1404 470" preserveAspectRatio="none">
          <path id="trend-line" d="M210 372 L702 250 L1194 96" pathLength="1" />
        </svg>

        <div id="slot-1" class="slot"></div>
        <div id="slot-2" class="slot"></div>
        <div id="slot-3" class="slot"></div>

        <div id="cols">
          <div class="col weak">
            <div class="col-head">Week 1</div>
            <div class="col-score" id="s1">0.00</div>
            <div class="col-sub">learning what fits</div>
            <div class="track"><span class="fill" id="f1"></span></div>
            <div class="rows">
              <div class="row">
                <span class="row-handle">@quick_take_q</span><span class="pill">0.58</span>
              </div>
              <div class="row">
                <span class="row-handle">@alex_scaling</span><span class="pill">0.62</span>
              </div>
            </div>
          </div>

          <div class="col mid">
            <div class="col-head">Week 4</div>
            <div class="col-score" id="s2">0.00</div>
            <div class="col-sub">your ICP is taking shape</div>
            <div class="track"><span class="fill" id="f2"></span></div>
            <div class="rows">
              <div class="row">
                <span class="row-handle">@hr_helen</span><span class="pill">0.76</span>
              </div>
              <div class="row">
                <span class="row-handle">@mike.torres</span><span class="pill">0.80</span>
              </div>
            </div>
          </div>

          <div class="col strong">
            <div class="col-head">Week 12</div>
            <div class="col-score" id="s3">0.00</div>
            <div class="col-sub">near-perfect fit</div>
            <div class="track"><span class="fill" id="f3"></span></div>
            <div class="rows">
              <div class="row">
                <span class="row-handle">@ops_ninja</span><span class="pill">0.89</span>
              </div>
              <div class="row">
                <span class="row-handle">@devops_kate</span><span class="pill">0.93</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Counters run off a proxy object so each frame is a pure function of time. */
      function count(sel, to, at, dur) {
        const el = document.querySelector(sel);
        const o = { v: 0 };
        tl.to(
          o,
          {
            v: to,
            duration: dur,
            ease: "power2.out",
            onUpdate: () => {
              el.textContent = o.v.toFixed(2);
            },
          },
          at,
        );
      }

      const COLS = [
        { col: 0, score: 0.6, fill: 0.6, at: 0.45 },
        { col: 1, score: 0.78, fill: 0.78, at: 1.4 },
        { col: 2, score: 0.91, fill: 0.91, at: 2.35 },
      ];

      tl.fromTo("#cap-top", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5 }, 0.15);

      const cols = gsap.utils.toArray(".col");
      COLS.forEach((c, i) => {
        tl.fromTo(
          cols[c.col],
          { opacity: 0, scale: 0.93, y: 34 },
          { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" },
          c.at,
        );
        count("#s" + (i + 1), c.score, c.at + 0.15, 0.85);
        tl.fromTo(
          "#f" + (i + 1),
          { scaleX: 0, opacity: 1 },
          { scaleX: c.fill, duration: 0.85, ease: "power2.out" },
          c.at + 0.15,
        );
      });

      /* the trend draws through the three tiles once they are all in */
      tl.fromTo(
        "#trend-line",
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" },
        0.9,
      );
      tl.fromTo("#bg-glow", { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "sine.out" }, 2.35);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
