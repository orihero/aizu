<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AIZU — Scene 07 · Six Platforms In, Hot Leads Out</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Sora";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/sora-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --bg: #0e0f14;
        --surface: #181a22;
        --surface-2: #20232d;
        --border: #282c38;
        --text: #f1f2f6;
        --muted: #a2a7b6;
        /* Ink × Lime's dark --faint is #6b7080; on --surface that is 3.5:1 and fails AA
           at video scale, the dark-mode twin of the light palette's --faint problem. */
        --faint: #8f96a8;
        --lime: #d9f24f;
        --on-lime: #16161a;
        --r-tile: 23px;
        --r-card: 17px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      #bg-glow {
        position: absolute;
        left: 360px;
        top: 340px;
        width: 1200px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 242, 79, 0.16), rgba(217, 242, 79, 0) 70%);
        filter: blur(70px);
        opacity: 0;
      }

      #scene {
        position: absolute;
        inset: 0;
      }

      .caption {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: Sora, Inter, sans-serif;
        font-weight: 600;
        font-size: 24px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0;
      }
      #cap-top {
        top: 96px;
      }
      #cap-out {
        top: 690px;
      }

      /* ---------- the six platforms ---------- */
      #plats {
        position: absolute;
        left: 0;
        right: 0;
        top: 156px;
        display: flex;
        justify-content: center;
        gap: 28px;
      }
      .plat {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 104px;
        height: 104px;
        border-radius: var(--r-tile);
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
        opacity: 0;
      }
      .plat img {
        display: block;
        width: 52px;
        height: 52px;
        object-fit: contain;
      }

      /* faint beams tie each platform to the filter, so the middle of the frame reads
         as a mechanism rather than empty space */
      .beam {
        position: absolute;
        top: 318px;
        width: 2px;
        height: 250px;
        background: linear-gradient(to bottom, rgba(217, 242, 79, 0.28), rgba(217, 242, 79, 0));
        opacity: 0;
      }

      /* ---------- raw signal falling out of them ---------- */
      .sig {
        position: absolute;
        width: 52px;
        height: 16px;
        border-radius: 999px;
        background: #39404f;
        opacity: 0;
      }

      /* ---------- the filter ---------- */
      #filter {
        position: absolute;
        left: 300px;
        top: 566px;
        width: 1320px;
        height: 6px;
        border-radius: 999px;
        background: var(--lime);
        transform-origin: 50% 50%;
        box-shadow: 0 0 40px rgba(217, 242, 79, 0.5);
        opacity: 0;
      }
      #filter-tag {
        position: absolute;
        left: 0;
        right: 0;
        top: 600px;
        text-align: center;
        font-family: Sora, Inter, sans-serif;
        font-weight: 600;
        font-size: 25px;
        letter-spacing: 0.02em;
        color: var(--lime);
        opacity: 0;
      }

      /* ---------- what survives ---------- */
      #leads {
        position: absolute;
        left: 0;
        right: 0;
        top: 762px;
        display: flex;
        justify-content: center;
        gap: 32px;
      }
      .lead {
        display: flex;
        align-items: center;
        gap: 20px;
        width: 380px;
        padding: 24px 26px;
        border-radius: var(--r-card);
        background: var(--surface);
        border: 1px solid var(--lime);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 30px rgba(217, 242, 79, 0.12);
        opacity: 0;
      }
      .lead-av {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        font-family: Sora, Inter, sans-serif;
        font-weight: 600;
        font-size: 22px;
        color: var(--text);
      }
      .lead-copy {
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-width: 0;
      }
      .lead-handle {
        font-family: Sora, Inter, sans-serif;
        font-weight: 600;
        font-size: 25px;
      }
      .lead-meta {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .score {
        padding: 3px 12px;
        border-radius: 999px;
        background: var(--lime);
        color: var(--on-lime);
        font-family: Sora, Inter, sans-serif;
        font-weight: 700;
        font-size: 19px;
      }
      .lead-src {
        font-size: 19px;
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5.8"
    >
      <div id="bg" class="clip" data-start="0" data-duration="5.8" data-track-index="0">
        <div id="bg-glow"></div>
      </div>

      <div id="scene" class="clip" data-start="0" data-duration="5.8" data-track-index="1">
        <div id="cap-top" class="caption">watching posts like yours</div>

        <div id="plats">
          <div class="plat"><img src=".media/images/logo_002.svg" alt="Instagram" /></div>
          <div class="plat"><img src=".media/images/logo_001.svg" alt="Telegram" /></div>
          <div class="plat"><img src=".media/images/logo_006.svg" alt="YouTube" /></div>
          <div class="plat"><img src=".media/images/logo_004.svg" alt="LinkedIn" /></div>
          <div class="plat"><img src=".media/images/logo_008.svg" alt="Reddit" /></div>
          <div class="plat"><img src=".media/images/logo_010.svg" alt="X" /></div>
        </div>

        <div id="beams"></div>
        <div id="sigs"></div>

        <div id="filter"></div>
        <div id="filter-tag">relevance + buying intent</div>

        <div id="cap-out" class="caption">hot leads</div>

        <div id="leads">
          <div class="lead">
            <div class="lead-av">DT</div>
            <div class="lead-copy">
              <div class="lead-handle">@dana_t</div>
              <div class="lead-meta">
                <span class="score">0.91</span><span class="lead-src">reddit</span>
              </div>
            </div>
          </div>
          <div class="lead">
            <div class="lead-av">MR</div>
            <div class="lead-copy">
              <div class="lead-handle">@marcus_ops</div>
              <div class="lead-meta">
                <span class="score">0.84</span><span class="lead-src">linkedin</span>
              </div>
            </div>
          </div>
          <div class="lead">
            <div class="lead-av">SK</div>
            <div class="lead-copy">
              <div class="lead-handle">@sarah_kb</div>
              <div class="lead-meta">
                <span class="score">0.78</span><span class="lead-src">x</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Index-derived placement — deterministic under seek, no Math.random. */
      const SIG_N = 34;
      const jitter = (i, m) => ((i * 41) % m) - Math.floor(m / 2);

      /* chip centres: row is 6×104 + 5×28 = 764 wide, centred, so chip i sits at 630 + 132i */
      const beamHost = document.getElementById("beams");
      for (let i = 0; i < 6; i++) {
        const b = document.createElement("div");
        b.className = "beam";
        b.id = "beam-" + i;
        b.style.left = 630 + i * 132 - 1 + "px";
        beamHost.appendChild(b);
      }

      const host = document.getElementById("sigs");
      for (let i = 0; i < SIG_N; i++) {
        const s = document.createElement("div");
        s.className = "sig";
        s.id = "sig-" + i;
        s.style.left = 452 + ((i * 137) % 1040) + "px";
        s.style.top = 322 + ((i * 53) % 46) + "px";
        host.appendChild(s);
      }

      const PLATS_AT = 0.05;
      const SIGS_AT = 0.7;
      const FILTER_AT = 2.2;
      const LEADS_AT = 3.15;
      const SCENE_END = 5.8;

      tl.fromTo("#cap-top", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5 }, PLATS_AT);

      /* 1 · the six platforms AIZU is watching */
      gsap.utils.toArray(".plat").forEach((el, i) => {
        tl.fromTo(
          el,
          { opacity: 0, scale: 0.6, y: -18 },
          { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
          PLATS_AT + i * 0.07,
        );
      });

      gsap.utils.toArray(".beam").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.5 }, PLATS_AT + 0.3 + i * 0.05);
      });

      /* 2 · raw signal pours out of them — waves overlap the filter so the middle of
         the scene never goes quiet */
      for (let i = 0; i < SIG_N; i++) {
        const at = SIGS_AT + (i % 9) * 0.085 + Math.floor(i / 9) * 0.42;
        tl.fromTo(
          "#sig-" + i,
          { opacity: 0, y: -40 },
          { opacity: 0.85, y: 0, duration: 0.28, ease: "none" },
          at,
        );
        tl.to(
          "#sig-" + i,
          { y: 236 + jitter(i, 30), duration: 1.15, ease: "power1.in" },
          at + 0.14,
        );
        /* almost all of it dies at the filter line */
        tl.to("#sig-" + i, { opacity: 0, duration: 0.22, ease: "none" }, at + 1.1);
      }

      /* 3 · the filter */
      tl.fromTo(
        "#filter",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.7, ease: "power3.inOut" },
        FILTER_AT,
      );
      tl.fromTo("#filter-tag", { opacity: 0 }, { opacity: 1, duration: 0.45 }, FILTER_AT + 0.35);
      tl.fromTo("#bg-glow", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "sine.out" }, FILTER_AT);

      /* 4 · three make it through, scored */
      tl.fromTo("#cap-out", { opacity: 0 }, { opacity: 1, duration: 0.45 }, LEADS_AT - 0.15);
      gsap.utils.toArray(".lead").forEach((el, i) => {
        tl.fromTo(
          el,
          { opacity: 0, scale: 0.9, y: 30 },
          { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
          LEADS_AT + i * 0.14,
        );
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
