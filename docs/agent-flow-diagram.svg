    <path d="M470,1459 C640,1459 640,1603 478,1603" stroke-dasharray="4 4" marker-end="url(#arw)"/>
    <path d="M470,394 L500,394" marker-end="url(#arw)"/>
    <path d="M470,1027 L500,1027" marker-end="url(#arw)"/>
