  </g>

  <g class="ln">
    <path d="M575,1936 C620,1958 96,1958 96,803 L130,803" marker-end="url(#arw)"/>
    <path d="M575,1116 C540,1132 104,1132 100,812" stroke-dasharray="4 4"/>
    <path d="M575,1044 C540,1060 106,1060 100,812" stroke-dasharray="4 4"/>
